<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0b0b0f">

  <title>1tzKonst — ROBLOX скрипты, uncopylocked игры и инструменты</title>
  <meta name="description" content="Официальный сайт 1tzKonst. ROBLOX скрипты (Solara), uncopylocked игры, WPM-тест и открытые инструменты.">
  <meta name="keywords" content="1tzKonst, ROBLOX, scripts, uncopylocked, Roblox games, solara, lua scripts, wpm test">
  <meta name="author" content="1tzKonst">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://itzkonstcreator.github.io/index.html">

  <!-- Open Graph -->
  <meta property="og:title" content="1tzKonst — ROBLOX скрипты, uncopylocked игры и инструменты">
  <meta property="og:description" content="ROBLOX скрипты (Solara), uncopylocked игры, WPM-тест и открытые инструменты.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://itzkonstcreator.github.io/">
  <meta property="og:image" content="https://itzkonstcreator.github.io/docs/og-image.svg">
  <meta property="og:locale" content="ru_RU">

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="1tzKonst — ROBLOX скрипты, uncopylocked игры и инструменты">
  <meta name="twitter:description" content="ROBLOX скрипты (Solara), uncopylocked игры, WPM-тест и открытые инструменты.">
  <meta name="twitter:image" content="https://itzkonstcreator.github.io/docs/og-image.svg">

  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="apple-touch-icon" href="og-image.svg">
  <link rel="manifest" href="manifest.webmanifest">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="preload" href="styles.css" as="style">
  <link rel="stylesheet" href="styles.css">
  <link rel="preload" href="app.js" as="script">
  <script src="app.js" defer></script>
</head>
<body>
  <main id="main" class="container page">

    <!-- HERO -->
    <section class="hero reveal" style="--i:0">
      <span class="hero-mark" aria-hidden="true">⚡</span>
      <h1 class="hero-title">1tzKonst</h1>
      <p class="hero-subtitle">ROBLOX-скрипты, uncopylocked-игры и инструменты для разработчиков. Открыто, быстро, без лишнего.</p>
      <div class="hero-actions">
        <a href="scripts.html" class="btn">🛠️ Скрипты</a>
        <a href="uncopylocked.html" class="btn btn-ghost">🎮 Uncopylocked</a>
        <a href="wpmtest.html" class="btn btn-ghost">⌨️ WPM Test</a>
      </div>
      <div class="hero-stats" id="heroStats" aria-live="polite"></div>
    </section>

    <!-- SEARCH + FILTER -->
    <section class="toolbar reveal" style="--i:1" aria-label="Поиск и фильтры">
      <div class="search-bar">
        <span class="search-bar-icon" aria-hidden="true">🔍</span>
        <input type="search" id="searchInput" placeholder="Поиск по проектам…" aria-label="Поиск">
      </div>
      <div class="filter-chips" role="tablist" aria-label="Фильтр категорий">
        <button class="filter-chip filter-chip--active" data-filter="all" role="tab" aria-selected="true">Все</button>
        <button class="filter-chip" data-filter="games" role="tab" aria-selected="false">Игры</button>
        <button class="filter-chip" data-filter="scripts" role="tab" aria-selected="false">Скрипты</button>
        <button class="filter-chip" data-filter="tools" role="tab" aria-selected="false">Инструменты</button>
      </div>
    </section>

    <!-- FEATURED STRIP -->
    <section class="featured-strip reveal" style="--i:2" aria-label="Избранные проекты" id="featuredStrip">
      <!-- filled by JS -->
    </section>

    <!-- PROJECT GRID -->
    <section class="cards-grid cards-grid--filterable reveal" id="projects" aria-label="Все проекты">
      <!-- skeletons -->
      <a class="card-mini skeleton" style="height:96px"></a>
      <a class="card-mini skeleton" style="height:96px"></a>
      <a class="card-mini skeleton" style="height:96px"></a>
      <a class="card-mini skeleton" style="height:96px"></a>
      <a class="card-mini skeleton" style="height:96px"></a>
      <a class="card-mini skeleton" style="height:96px"></a>
    </section>

  </main>

  <script>
    (async function () {
      const esc = window.app.escapeHTML;
      let data;
      try {
        data = await window.app.loadData();
      } catch (e) {
        document.getElementById('projects').innerHTML =
          '<div class="empty-state"><div class="empty-state-icon">⚠️</div>Не удалось загрузить список проектов.</div>';
        return;
      }

      // Stats
      const heroStats = document.getElementById('heroStats');
      heroStats.innerHTML =
        '<span class="hero-stat"><strong>' + data.stats.games + '</strong>&nbsp;игр</span>' +
        '<span class="hero-stat"><strong>' + data.stats.scripts + '</strong>&nbsp;скрипт</span>' +
        '<span class="hero-stat"><strong>' + (data.stats.wpmWords/1000).toFixed(0) + 'k</strong>&nbsp;слов в WPM</span>';

      // Items definition
      const items = [
        { href: 'uncopylocked.html', icon: '🎮', title: 'Uncopylocked', desc: 'Roblox Games', tags: 'games', filterTags: ['games', 'tools'] },
        { href: 'scripts.html',     icon: '🛠️', title: 'Scripts',      desc: 'ROBLOX скрипты', tags: 'scripts', filterTags: ['scripts'] },
        { href: 'wpmtest.html',     icon: '⌨️', title: 'WPM Test',     desc: 'Скорость печати', tags: 'tools', filterTags: ['tools'] },
        { href: 'about.html',       icon: '👤', title: 'About',        desc: 'О проекте', tags: 'tools', filterTags: ['tools'] },
        { href: 'https://www.youtube.com/@Itzkonst',     icon: '▶️', title: 'YouTube', desc: 'Видео и туториалы', tags: 'tools', external: true, filterTags: ['tools'] },
        { href: 'https://github.com/itzkonstCreator',     icon: '📦', title: 'GitHub',  desc: 'Исходный код',      tags: 'tools', external: true, filterTags: ['tools'] }
      ];

      const grid = document.getElementById('projects');
      grid.innerHTML = items.map((it, i) => {
        const tfilter = it.filterTags.join(' ');
        return '<a href="' + it.href + '"' + (it.external ? ' target="_blank" rel="noopener noreferrer"' : '') +
          ' class="card-mini reveal" style="--i:' + (3 + i) + '" data-tags="' + tfilter + '" data-title="' + esc(it.title.toLowerCase()) + '" data-desc="' + esc(it.desc.toLowerCase()) + '">' +
          '<div class="card-mini-icon">' + it.icon + '</div>' +
          '<div class="card-mini-content">' +
            '<h3>' + esc(it.title) + '</h3>' +
            '<p>' + esc(it.desc) + '</p>' +
          '</div>' +
        '</a>';
      }).join('');

      // Trigger reveal animation for newly injected items
      const io = new IntersectionObserver((entries) => {
        entries.forEach(e => {
          if (e.isIntersecting) {
            e.target.classList.add('reveal--in');
            io.unobserve(e.target);
          }
        });
      }, { threshold: 0.05 });
      grid.querySelectorAll('.reveal').forEach(el => io.observe(el));

      // Featured strip
      const featured = document.getElementById('featuredStrip');
      const lastGame = (data.games || [])[0];
      const lastScript = (data.scripts || [])[0];
      let html = '';
      if (lastGame) {
        html += '<a class="featured-card" href="uncopylocked.html">' +
                  '<span class="tag tag--accent">Последняя игра</span>' +
                  '<h3>🎮 ' + esc(lastGame.title) + '</h3>' +
                  '<p>' + esc((lastGame.tags || []).join(' · ')) + '</p>' +
                '</a>';
      }
      if (lastScript) {
        html += '<a class="featured-card" href="scripts.html">' +
                  '<span class="tag tag--purple">Скрипт</span>' +
                  '<h3>' + (lastScript.icon || '🔮') + ' ' + esc(lastScript.name) + '</h3>' +
                  '<p>' + esc(lastScript.description || '') + '</p>' +
                '</a>';
      }
      featured.innerHTML = html;

      // Filter & search
      const filterBtns = document.querySelectorAll('.filter-chip');
      const searchInput = document.getElementById('searchInput');
      let currentFilter = 'all';

      function applyFilter() {
        const q = (searchInput.value || '').trim().toLowerCase();
        let visible = 0;
        grid.querySelectorAll('.card-mini').forEach(el => {
          const tags = (el.dataset.tags || '').split(' ');
          const matchesFilter = currentFilter === 'all' || tags.includes(currentFilter);
          const haystack = (el.dataset.title || '') + ' ' + (el.dataset.desc || '');
          const matchesSearch = !q || haystack.includes(q);
          const show = matchesFilter && matchesSearch;
          el.classList.toggle('is-hidden', !show);
          if (show) visible++;
        });
        let empty = grid.querySelector('.empty-state--inline');
        if (visible === 0) {
          if (!empty) {
            empty = document.createElement('div');
            empty.className = 'empty-state empty-state--inline';
            empty.innerHTML = '<div class="empty-state-icon">🤷</div>Ничего не найдено. Попробуй другой запрос.';
            grid.appendChild(empty);
          }
        } else if (empty) {
          empty.remove();
        }
      }

      filterBtns.forEach(b => b.addEventListener('click', () => {
        filterBtns.forEach(x => {
          x.classList.remove('filter-chip--active');
          x.setAttribute('aria-selected', 'false');
        });
        b.classList.add('filter-chip--active');
        b.setAttribute('aria-selected', 'true');
        currentFilter = b.dataset.filter;
        applyFilter();
      }));
      searchInput.addEventListener('input', applyFilter);
    })();
  </script>
</body>
</html>
