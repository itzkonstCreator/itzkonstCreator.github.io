<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b0b0f">

  <title>Uncopylocked — 1tzKonst</title>
  <meta name="description" content="Открытые для изучения и скачивания ROBLOX-игры (uncopylocked). Коллекция от 1tzKonst.">
  <link rel="canonical" href="https://itzkonstcreator.github.io/docs/uncopylocked.html">

  <meta property="og:title" content="Uncopylocked — 1tzKonst">
  <meta property="og:description" content="Открытые для изучения ROBLOX-игры.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="https://itzkonstcreator.github.io/docs/og-image.svg">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="manifest" href="manifest.webmanifest">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="preload" href="styles.css" as="style">
  <link rel="stylesheet" href="styles.css">
  <link rel="preload" href="app.js" as="script">
  <script src="app.js" defer></script>
</head>
<body>
  <main id="main" class="container page">

    <div class="page-header reveal" style="--i:0">
      <h1 class="page-title">🎮 Uncopylocked Games</h1>
      <p class="page-subtitle">Открытые ROBLOX-игры. Скачивай, изучай механики, переделывай под себя.</p>
    </div>

    <section class="toolbar reveal" style="--i:1" aria-label="Поиск">
      <div class="search-bar">
        <span class="search-bar-icon" aria-hidden="true">🔍</span>
        <input type="search" id="searchInput" placeholder="Поиск по названию…" aria-label="Поиск">
      </div>
    </section>

    <section id="gamesList" class="list" aria-label="Список игр" style="width:100%;max-width:760px;display:flex;flex-direction:column;gap:0.8rem">
      <!-- skeletons -->
      <div class="list-card skeleton" style="height:78px"></div>
      <div class="list-card skeleton" style="height:78px"></div>
      <div class="list-card skeleton" style="height:78px"></div>
    </section>

  </main>

  <script>
    (async function () {
      const esc = window.app.escapeHTML;
      const list = document.getElementById('gamesList');
      const search = document.getElementById('searchInput');
      let data;

      try {
        data = await window.app.loadData();
      } catch (e) {
        list.innerHTML = '<div class="empty-state"><div class="empty-state-icon">⚠️</div>Не удалось загрузить список игр.</div>';
        return;
      }

      function render(games) {
        if (!games.length) {
          list.innerHTML = '<div class="empty-state"><div class="empty-state-icon">🔎</div>Ничего не найдено.</div>';
          return;
        }
        list.innerHTML = games.map((g, i) => {
          const tags = (g.tags || []).map(t => {
            const cls = t === 'uncopylocked' ? 'tag--accent' : 'tag--blue';
            return '<span class="tag ' + cls + '">' + esc(t) + '</span>';
          }).join('');
          return '<article class="list-card reveal" style="--i:' + i + '" data-title="' + esc(g.title.toLowerCase()) + '">' +
            '<div>' +
              '<div class="list-card-title">' +
                '<span aria-hidden="true">🎮</span>' +
                esc(g.title) +
              '</div>' +
              '<div class="list-card-meta">' + tags +
                (g.added ? '<span class="tag">' + esc(g.added) + '</span>' : '') +
              '</div>' +
            '</div>' +
            '<div class="list-card-actions">' +
              '<a class="btn" href="' + esc(g.url) + '" target="_blank" rel="noopener noreferrer">⬇ Скачать <i>→</i></a>' +
            '</div>' +
          '</article>';
        }).join('');
        const io = new IntersectionObserver(es => es.forEach(e => {
          if (e.isIntersecting) { e.target.classList.add('reveal--in'); io.unobserve(e.target); }
        }), { threshold: 0.05 });
        list.querySelectorAll('.reveal').forEach(el => io.observe(el));
      }

      const games = (data.games || []).slice().sort((a, b) => (b.added || '').localeCompare(a.added || ''));
      render(games);

      search.addEventListener('input', () => {
        const q = (search.value || '').trim().toLowerCase();
        render(games.filter(g => g.title.toLowerCase().includes(q)));
      });
    })();
  </script>
</body>
</html>
